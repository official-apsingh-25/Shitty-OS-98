<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <!-- Basement Room Glow -->
  <rect width="320" height="240" fill="#18181b"/>
  <!-- CRT Monitors glowing green and blue -->
  <rect x="30" y="70" width="75" height="60" fill="#d4d4d8" stroke="#71717a" stroke-width="2"/>
  <rect x="38" y="78" width="59" height="44" fill="#000080"/>
  <text x="45" y="104" fill="#ffffff" font-family="monospace" font-size="10">QUAKE II</text>
  
  <rect x="130" y="65" width="80" height="65" fill="#d4d4d8" stroke="#71717a" stroke-width="2"/>
  <rect x="138" y="73" width="64" height="49" fill="#008000"/>
  <text x="145" y="102" fill="#ffff00" font-family="monospace" font-size="10">DOOM 95</text>

  <rect x="230" y="75" width="70" height="55" fill="#d4d4d8" stroke="#71717a" stroke-width="2"/>
  <rect x="236" y="81" width="58" height="43" fill="#800000"/>
  <text x="242" y="105" fill="#ffffff" font-family="monospace" font-size="9">DIABLO</text>

  <!-- Table & Tangle of 10Base-T Ethernet Cables -->
  <rect x="10" y="130" width="300" height="20" fill="#52525b"/>
  <path d="M20 150 Q80 190 150 160 T290 170" fill="none" stroke="#eab308" stroke-width="2"/>
  <path d="M40 160 Q120 170 200 155 T280 190" fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- Pizza Box on the floor -->
  <polygon points="120,180 180,180 170,210 110,210" fill="#e4d5b7" stroke="#78350f" stroke-width="1"/>
  <text x="125" y="200" fill="#b91c1c" font-family="sans-serif" font-weight="bold" font-size="8">PIZZA</text>

  <!-- Vintage 1998 Camera Date Stamp -->
  <text x="220" y="225" fill="#ff6600" font-family="'Courier New', monospace" font-size="13" font-weight="bold">'98 10 24</text>
</svg>

